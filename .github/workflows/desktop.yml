name: Desktop build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: Claw-windows
            path: dist/Claw.exe
          - os: macos-latest
            artifact: Claw-macos
            path: dist/Claw.app
          - os: ubuntu-latest
            artifact: Claw-linux
            path: dist/Claw

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      # The Linux window needs WebKitGTK at runtime; without it the app cannot
      # open, and PyInstaller would still happily build a broken binary.
      - name: Linux runtime dependency
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-gi gir1.2-webkit2-4.1 libgirepository1.0-dev \
                                  gir1.2-gtk-3.0 xvfb libxdo3

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt pyinstaller

      - name: Tests
        run: python -m pytest -q

      - name: Build
        shell: bash
        run: python -m PyInstaller --noconfirm --clean packaging/claw.spec

      # Smoke-test the actual binary: a bundle that starts from source but not
      # after freezing is exactly the failure users report.
      - name: Smoke-test the binary (Linux)
        if: runner.os == 'Linux'
        run: |
          xvfb-run -a ./dist/Claw --self-check
          # The report file is what a windowed build leaves behind; assert on it too.
          grep -q "All checks passed" "$HOME/.config/Claw/self-check.txt"

      - name: Smoke-test the binary (macOS)
        if: runner.os == 'macOS'
        run: |
          ./dist/Claw.app/Contents/MacOS/Claw --self-check
          grep -q "frozen:      True" "$HOME/Library/Application Support/Claw/self-check.txt"

      # A windowed (no-console) Windows binary detaches from cmd the moment it
      # starts, so `cmd /c` returns before the check runs. Wait on the process
      # and assert on the report file it writes.
      - name: Smoke-test the binary (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Start-Process -FilePath dist\Claw.exe -ArgumentList '--self-check' -Wait
          $report = Join-Path $env:APPDATA 'Claw\self-check.txt'
          Get-Content $report
          if (-not (Select-String -Path $report -Pattern 'All checks passed')) {
            throw 'Frozen binary failed its self-check'
          }
          if (-not (Select-String -Path $report -Pattern 'frozen:\s+True')) {
            throw 'Binary ran from source instead of the frozen bundle'
          }

      - name: Upload self-check report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}-self-check
          path: |
            **/self-check.txt
            **/claw-crash.log
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.path }}
          if-no-files-found: error
          retention-days: 30

  release:
    name: attach to release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Package
        run: |
          cd artifacts
          for dir in */; do
            name="${dir%/}"
            (cd "$name" && zip -r "../${name}.zip" .)
          done
          ls -lh ../artifacts/*.zip

      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*.zip
          generate_release_notes: true
