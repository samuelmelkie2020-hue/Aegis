name: Desktop build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: Aegis-windows
            path: dist/Aegis.exe
          - os: macos-latest
            artifact: Aegis-macos
            path: dist/Aegis.app
          - os: ubuntu-latest
            artifact: Aegis-linux
            path: dist/Aegis

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      # The Linux window needs WebKitGTK at runtime; without it the app cannot
      # open, and PyInstaller would still happily build a broken binary.
      - name: Linux runtime dependency
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-gi gir1.2-webkit2-4.1 libgirepository1.0-dev \
                                  gir1.2-gtk-3.0 xvfb libxdo3

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt pyinstaller

      - name: Tests
        env:
          # No display on a runner: a crash dialog would block forever.
          AEGIS_NO_GUI_ERRORS: "1"
        run: python -m pytest -q

      # The icon is generated, not hand-drawn, so a missing asset shows up here
      # rather than as a mystery blank icon in a released installer.
      # A tag says what version this is; make sure the code agrees before
      # anything is published. v1.3.0 shipped while the package still said
      # 1.0.0, which makes bug reports point at the wrong build.
      - name: Tag matches the package version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          python - <<'PY'
          import os, sys
          from aegis import __version__
          tag = os.environ["GITHUB_REF_NAME"].lstrip("v")
          if tag != __version__:
              sys.exit(f"tag {tag} != package version {__version__}")
          print(f"tag matches package version {__version__}")
          PY

      - name: Verify the application icon
        shell: bash
        run: |
          python - <<'PY'
          import sys
          from pathlib import Path
          want = [Path("packaging/assets/aegis.png"),
                  Path("packaging/assets/aegis.ico"),
                  Path("packaging/assets/aegis.icns")]
          missing = [str(p) for p in want if not p.is_file()]
          if missing:
              sys.exit(f"missing icon assets (run packaging/make_icon.py): {missing}")
          print("icon assets present:", [p.name for p in want])
          PY

      - name: Build
        shell: bash
        run: python -m PyInstaller --noconfirm --clean packaging/aegis.spec

      # Smoke-test the actual binary: a bundle that starts from source but not
      # after freezing is exactly the failure users report.
      - name: Smoke-test the binary (Linux)
        if: runner.os == 'Linux'
        run: |
          xvfb-run -a ./dist/Aegis --self-check
          # The report file is what a windowed build leaves behind; assert on it too.
          grep -q "All checks passed" "$HOME/.config/Aegis/self-check.txt"

      - name: Smoke-test the binary (macOS)
        if: runner.os == 'macOS'
        run: |
          ./dist/Aegis.app/Contents/MacOS/Aegis --self-check
          grep -q "frozen:      True" "$HOME/Library/Application Support/Aegis/self-check.txt"

      # A windowed (no-console) Windows binary detaches from cmd the moment it
      # starts, so `cmd /c` returns before the check runs. Wait on the process
      # and assert on the report file it writes.
      - name: Smoke-test the binary (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Start-Process -FilePath dist\Aegis.exe -ArgumentList '--self-check' -Wait
          $report = Join-Path $env:APPDATA 'Aegis\self-check.txt'
          Get-Content $report
          if (-not (Select-String -Path $report -Pattern 'All checks passed')) {
            throw 'Frozen binary failed its self-check'
          }
          if (-not (Select-String -Path $report -Pattern 'frozen:\s+True')) {
            throw 'Binary ran from source instead of the frozen bundle'
          }

      # The one thing no unit test can prove: that a real window opens on a real
      # desktop. Runs the packaged binary as a normal user would, with a watchdog,
      # and requires the app itself to say WINDOW CREATED. A screenshot is kept as
      # evidence for the OS where grabbing one is trivial.
      - name: Prove a real window opens (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        timeout-minutes: 5
        env:
          AEGIS_WINDOW_PROOF: "1"
          AEGIS_WINDOW_PROOF_SECONDS: "8"
        run: |
          $p = Start-Process -FilePath dist\Aegis.exe -ArgumentList '--window-proof' -PassThru
          if (-not $p.WaitForExit(90000)) { $p.Kill(); throw 'Aegis never exited: a window likely never opened' }
          Write-Host "exit code: $($p.ExitCode)"
          $log = Join-Path $env:APPDATA 'Aegis\aegis-startup.log'
          Get-Content $log -Tail 15
          if ($p.ExitCode -ne 0) { throw "window proof failed with exit code $($p.ExitCode)" }
          if (-not (Select-String -Path $log -Pattern 'WINDOW CREATED')) { throw 'no WINDOW CREATED in the startup log' }
          New-Item -ItemType Directory -Force -Path artifacts | Out-Null
          Copy-Item $log artifacts\windows-startup.log
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          $b = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
          $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
          $g = [System.Drawing.Graphics]::FromImage($bmp)
          $g.CopyFromScreen($b.Location, [System.Drawing.Point]::Empty, $b.Size)
          $bmp.Save("$PWD\artifacts\windows-desktop.png")
          Write-Host 'screenshot saved'

      - name: Prove a real window opens (Linux)
        if: runner.os == 'Linux'
        timeout-minutes: 5
        env:
          AEGIS_WINDOW_PROOF: "1"
          AEGIS_WINDOW_PROOF_SECONDS: "8"
        run: |
          sudo apt-get install -y imagemagick >/dev/null 2>&1 || true
          mkdir -p artifacts
          if xvfb-run -a ./dist/Aegis --window-proof; then code=0; else code=$?; fi
          echo "exit code: $code"
          tail -15 "$HOME/.config/Aegis/aegis-startup.log"
          cp "$HOME/.config/Aegis/aegis-startup.log" artifacts/linux-startup.log
          # Evidence, best effort: xwd/magick may not be present on the runner.
          (xvfb-run -a --server-args="-screen 0 1280x900x24" import -window root artifacts/linux-desktop.png) || true
          test "$code" -eq 0
          grep -q "WINDOW CREATED" "$HOME/.config/Aegis/aegis-startup.log"

      - name: Prove a real window opens (macOS)
        if: runner.os == 'macOS'
        timeout-minutes: 5
        env:
          AEGIS_WINDOW_PROOF: "1"
          AEGIS_WINDOW_PROOF_SECONDS: "8"
        run: |
          mkdir -p artifacts
          # A runner session has a window server, but not always an activated one;
          # the app creates its window either way, which is what is asserted.
          ./dist/Aegis.app/Contents/MacOS/Aegis --window-proof
          echo "exit code: $?"
          LOG="$HOME/Library/Application Support/Aegis/aegis-startup.log"
          tail -15 "$LOG"
          cp "$LOG" artifacts/macos-startup.log
          screencapture -x artifacts/macos-desktop.png || true
          grep -q "WINDOW CREATED" "$LOG"

      - name: Upload window-proof evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: window-proof-${{ matrix.artifact }}
          path: artifacts
          if-no-files-found: warn

      - name: Upload self-check report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}-self-check
          path: |
            **/self-check.txt
            **/aegis-crash.log
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.path }}
          if-no-files-found: error
          retention-days: 30

  release:
    name: attach to release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Package
        run: |
          cd artifacts
          for dir in */; do
            name="${dir%/}"
            (cd "$name" && zip -r "../${name}.zip" .)
          done
          ls -lh ../artifacts/*.zip

      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*.zip
          generate_release_notes: true

      # Checked *after* uploading, because GitHub computes an asset's digest when
      # it stores it. A release whose assets have no digest cannot be installed by
      # the in-app updater — it verifies the download against that field before
      # unpacking an executable — so a release that would silently be refused is
      # failed here instead.
      - name: Every asset must carry a SHA-256 digest
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          # NOTE: `gh release view --json digest` does not request that field, so
          # it prints null for every asset on a perfectly good release. The REST
          # endpoint does return it.
          for attempt in 1 2 3 4 5; do
            gh api "repos/$GITHUB_REPOSITORY/releases/tags/$tag" \
              --jq '.assets[] | "\(.name)\t\(.digest)"' > digests.txt
            if [ "$(wc -l < digests.txt)" -gt 0 ] && ! grep -qv 'sha256:' digests.txt; then
              echo "--- all assets carry a digest ---"
              cat digests.txt
              exit 0
            fi
            echo "attempt $attempt: digests not ready yet"
            sleep 5
          done
          echo "--- assets as published ---"
          cat digests.txt
          echo "::error::An asset has no digest; the in-app updater would refuse it."
          exit 1
