name: Triage (Windows)

# TEMPORARY: surfaces the failing test as a check-run annotation, because the
# job-log endpoint is unreachable from where this is being investigated.
on:
  pull_request:
  workflow_dispatch:

jobs:
  triage:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt pyinstaller
      - name: Pytest (collect the failure)
        shell: bash
        env:
          AEGIS_NO_GUI_ERRORS: "1"
        run: |
          set +e
          python -m pytest -q > pytest-out.txt 2>&1
          set -e
          python - <<'PY'
          import re
          from pathlib import Path
          text = Path("pytest-out.txt").read_text(encoding="utf-8", errors="replace")
          names = re.findall(r"^FAILED (\S+)", text, re.M)
          print(f"::error title=triage::{len(names)} failing: {', '.join(names[:6])}")
          blocks = re.split(r"^_{5,} (.+?) _{5,}$", text, flags=re.M)
          for i in range(1, len(blocks) - 1, 2):
              title = blocks[i][:100]
              body = blocks[i + 1]
              keep = [ln.strip() for ln in body.splitlines() if ln.strip().startswith(("E ", "> "))][:4]
              print("::error title=" + title + "::" + (" | ".join(keep)[:800] or body[:400]))
          print("::error title=tail::" + " | ".join(text.strip().splitlines()[-4:])[:600])
          PY
