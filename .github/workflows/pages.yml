name: Publish the website

# GitHub Pages is the second home for site/, because the Vercel account cannot
# create projects. site/ is a single self-contained HTML file with no build
# step, so publishing it is a copy: no npm, no framework, nothing to install.
#
# Pages has to exist on the repository before a workflow may publish to it, and
# only a person with repository admin can create it (the API refuses a token
# without the pages permission, and configure-pages' own "enablement" hits the
# same wall: "Resource not accessible by integration"). So this workflow warns
# and skips until it is on, rather than painting a red X on every push:
#
#   Settings -> Pages -> Source: GitHub Actions
#
# After that, this runs on its own. workflow_dispatch exists so it can be
# started by hand the moment the toggle is flipped.

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One publish at a time, and never cancel one that is already going live.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    name: publish site/
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Check the page before publishing it
        # The same contract the Python suite enforces, without Python: the page
        # exists, names the app, and loads no script from another host.
        run: |
          set -eu
          [ -s site/index.html ] || { echo "site/index.html is missing or empty"; exit 1; }
          grep -q "Aegis" site/index.html
          if grep -Eq '<script[^>]+src="https?://' site/index.html; then
            echo "site/index.html loads a script from another host"; exit 1
          fi
          echo "ok: $(wc -c < site/index.html) bytes"

      - name: Is Pages switched on?
        id: pages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          if gh api "repos/${{ github.repository }}/pages" > /dev/null 2>&1; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
            echo "Pages is on; publishing."
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=Pages is not enabled::Turn it on once — Settings → Pages → Source: GitHub Actions — then re-run this workflow. site/ is unchanged and ready to publish."
          fi

      - uses: actions/configure-pages@v5
        if: steps.pages.outputs.ready == 'true'

      - uses: actions/upload-pages-artifact@v3
        if: steps.pages.outputs.ready == 'true'
        with:
          path: site

      - id: deployment
        if: steps.pages.outputs.ready == 'true'
        uses: actions/deploy-pages@v4
