name: triage
on: [push]
jobs:
  win:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - name: run the bootstrap self-check directly
        shell: pwsh
        env:
          AEGIS_NO_GUI_ERRORS: "1"
        run: |
          $out = python packaging/entry.py --self-check 2>&1 | Out-String
          $code = $LASTEXITCODE
          $log = Join-Path $env:APPDATA 'Aegis\aegis-startup.log'
          if (Test-Path $log) { $out += "`n=== STARTUP LOG ===`n" + (Get-Content $log -Raw) }
          $crash = Join-Path $env:APPDATA 'Aegis\aegis-crash.log'
          if (Test-Path $crash) { $out += "`n=== CRASH LOG ===`n" + (Get-Content $crash -Raw) }
          $out += "`n=== python -c import webview ===`n"
          $out += (python -c "import webview; print('ok', webview.__version__)" 2>&1 | Out-String)
          # GitHub caps annotations at 10 per step, so pack everything into one.
          $joined = (($out -split "`r?`n") | Where-Object { $_ -ne '' }) -join '%0A'
          $joined = $joined -replace '%','%25' -replace "`r",''
          if ($joined.Length -gt 60000) { $joined = $joined.Substring(0, 60000) }
          Write-Host "::error::EXIT=$code%0A$joined"
          exit 0
