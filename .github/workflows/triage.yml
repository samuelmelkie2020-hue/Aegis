name: triage
on: [push]
jobs:
  win:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - name: run the bootstrap self-check directly
        shell: pwsh
        env:
          AEGIS_NO_GUI_ERRORS: "1"
        run: |
          $out = python packaging/entry.py --self-check 2>&1 | Out-String
          $code = $LASTEXITCODE
          foreach ($line in ($out -split "`r?`n")) {
            $safe = $line -replace '%','%25'
            Write-Host "::error::EXIT=$code | $safe"
          }
          exit 0
