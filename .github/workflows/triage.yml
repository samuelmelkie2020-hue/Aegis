name: Triage
on:
  push:
    branches: [arena/1ac33a84-claw]

jobs:
  triage:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Tests, failures only
        env:
          JARVIS_NO_GUI_ERRORS: "1"
        shell: bash
        run: |
          python -m pytest -q --tb=short > out.txt 2>&1 || true
          tail -40 out.txt
          echo "::error title=PYTESTTAIL::$(sed -n '1,40p' out.txt | tr '\n' '\r' | sed 's/%/%25/g;s/\r/%0A/g')"
