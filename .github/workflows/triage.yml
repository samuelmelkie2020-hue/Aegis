name: triage
on: [push]
jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - name: failures
        shell: bash
        env:
          AEGIS_NO_GUI_ERRORS: "1"
        run: |
          python -m pytest -q --tb=line 2>&1 | tee out.txt | tail -40 || true
          joined=$(grep -E "^(FAILED|ERROR)|Error|assert" out.txt | head -25 | tr '\n' '|')
          echo "::error::${{ matrix.os }} :: ${joined}"
