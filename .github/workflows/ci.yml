name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: tests (py${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.9 is deliberately absent: pydantic 2.14 requires >=3.10, and the
        # request models use `X | None` annotations.
        python: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      # pyautogui imports Xlib and needs a DISPLAY; keep the suite headless.
      # AEGIS_NO_GUI_ERRORS: with no display, a crash dialog would block forever
      # (a tkinter message box hung the Windows build for 40 minutes).
      - name: Tests
        env:
          PYTHONUNBUFFERED: "1"
          AEGIS_NO_GUI_ERRORS: "1"
        run: python -m pytest -q

  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install ruff
      - name: Ruff
        run: ruff check .

  javascript:
    name: javascript syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Syntax check
        run: node --check aegis/static/app.js
      - name: Unit tests (the wake word, and its wiring into the page)
        # There is no build step and no npm dependency: these are plain node
        # tests over a classic script. Passing the directory fails on Node 22,
        # so the glob is explicit.
        run: node --test "tests/js/*.test.mjs"
